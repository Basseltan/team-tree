<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Team-Tree">
  <title>Team-Tree</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app" aria-busy="true">
    <header class="top">
      <h1>Team-Tree</h1>
      <button class="conn" id="conn" type="button" title="Verbindung">
        <span class="dot"></span><span id="connText">Offline</span>
      </button>
    </header>

    <section class="stage" aria-label="Vorschau">
      <canvas id="tree" width="240" height="300" aria-hidden="true"></canvas>
      <p class="last" id="lastChange">&nbsp;</p>
    </section>

    <section class="card">
      <h2>Vorlagen</h2>
      <div class="presets" id="presets"></div>
    </section>

    <section class="card">
      <h2>Effekt</h2>
      <div class="modes" id="modes" role="radiogroup" aria-label="Effekt"></div>
    </section>

    <section class="card" id="colorCard">
      <h2>Farben</h2>
      <div class="colors" id="colors"></div>
      <p class="hint" id="colorHint"></p>
    </section>

    <section class="card">
      <label class="slider" id="speedRow">
        <span class="slider-head"><span>Tempo</span><output id="speedOut">5</output></span>
        <input type="range" id="speed" min="1" max="10" step="1" value="5">
      </label>
      <label class="slider">
        <span class="slider-head"><span>Helligkeit</span><output id="brightnessOut">60 %</output></span>
        <input type="range" id="brightness" min="0" max="100" step="5" value="60">
      </label>
    </section>

    <section class="card">
      <h2>Bäume <span class="count" id="treeCount"></span></h2>
      <ul class="trees" id="trees"><li class="empty">Noch keine Statusmeldungen empfangen.</li></ul>
    </section>

    <footer class="foot">
      <span id="whoami"></span>
      <button type="button" class="link" id="logout">Abmelden</button>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog class="login" id="login">
    <form method="dialog" id="loginForm">
      <h2>Willkommen am Team-Tree</h2>
      <p>Änderungen hier sehen sofort alle Bäume des Teams.</p>
      <label>Dein Name
        <input id="loginName" name="name" autocomplete="nickname" maxlength="24" required>
      </label>
      <label>Passwort
        <input id="loginPass" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="error" id="loginError"></p>
      <button type="submit" class="primary">Verbinden</button>
    </form>
  </dialog>

  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="effects.js"></script>
  <script src="app.js"></script>
</body>
</html>
