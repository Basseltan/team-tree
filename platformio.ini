; Team-Tree firmware - 3D-printed Christmas tree with WS2812B LEDs that stay
; in sync with all other trees via an MQTT broker (EMQX Cloud Serverless).

[env:team-tree]
platform = espressif32 @ ^6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; The ESP32-C3 Super Mini has no USB-UART chip - the native USB-Serial-JTAG
; peripheral is wired straight to the USB-C connector.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra

board_build.flash_size = 4MB
board_upload.flash_size = 4MB
; Two ~1.9 MB OTA app slots - TLS + WiFiManager + HTTP update do not fit
; comfortably into the default 1.25 MB slots.
board_build.partitions = min_spiffs.csv

; Broker root CA (DigiCert Global Root G2), embedded NUL-terminated.
; Linker symbol: _binary_certs_emqxsl_ca_crt_start
board_build.embed_txtfiles = certs/emqxsl-ca.crt

lib_deps =
    fastled/FastLED @ 3.9.20  ; 3.10.x fails to link on Arduino core 2.x / ESP32-C3
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
